server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Correlation-ID $http_x_correlation_id; }
    location /swagger-ui/ { proxy_pass http://backend:8080; }
    location /v3/api-docs { proxy_pass http://backend:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
