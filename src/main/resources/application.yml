spring:
  application:
    name: flowlab
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flowlab}
    username: ${DATABASE_USER:flowlab}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 16
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
    consumer:
      group-id: flowlab-engine-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
  shutdown: graceful
flowlab:
  jwt-secret: ${JWT_SECRET}
  jwt-ttl-seconds: 3600
  bootstrap-username: ${ADMIN_USERNAME:}
  bootstrap-password: ${ADMIN_PASSWORD:}
  kafka-enabled: ${KAFKA_ENABLED:false}
  scheduler-enabled: ${SCHEDULER_ENABLED:true}
  lease-seconds: ${TASK_LEASE_SECONDS:30}
  worker-concurrency: ${WORKER_CONCURRENCY:8}
  poll-ms: 500
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
management:
  server:
    port: 9091
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: flowlab
logging:
  structured:
    format:
      console: logstash
